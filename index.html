<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sign in | IT 002 IAS Final Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="course-tag">IT 002 // IT41S3 // INFORMATION ASSURANCE AND SECURITY 2</div>
<main class="auth-card">
<div class="eyebrow"><span class="dot"></span> SECURE ACCESS PORTAL</div>
<h1>Sign in<span class="period">.</span></h1>
<p class="subtext">Authenticate to access the website.</p>
<form id="login-form" novalidate>
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="32" placeholder="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="password" required></div>
<div id="login-message" class="message" role="status" aria-live="polite"></div>
<div id="attempts-message" class="helper"></div>
<div id="lockout-box" class="lockout-box" role="status"></div>
<button class="primary-btn" id="login-btn" type="submit">Sign in <span>↗</span></button>
</form>
<div class="auth-divider"><span>NEW HERE?</span></div>
<a class="secondary-btn" href="register.html">Create a user account</a>
<p class="fine-print">Website Defense Security. Try to access the Admin Page.</p>
</main>
<div class="page-footer">GROUP 7 <span>·</span> AUTHENTICATION DEFENSE FINAL PROJECT</div>
<script src="app.js"></script>
</body></html>
